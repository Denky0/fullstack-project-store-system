<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 border-0"
        style="width: 380px; background-color: #111; border-radius: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.9), 0 0 18px rgba(95,158,160,0.25); transform: translateY(-6px);">
        <h2 class="text-center mb-4" style="color: cadetblue; font-weight: 600;">Criar Conta</h2>
        <div class="mb-3">
            <label class="form-label text-light">Seu Nome</label>
            <input class="form-control bg-dark text-light border-secondary" type="text" id="nome"
                placeholder="Nome completo" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-light">Seu Email</label>
            <input class="form-control bg-dark text-light border-secondary" type="email" id="email" placeholder="Email"
                required>
        </div>
        <div class="mb-3">
            <label class="form-label text-light">Crie uma Senha</label>
            <input class="form-control bg-dark text-light border-secondary" type="password" id="senha"
                placeholder="Senha" required>
        </div>
        <div id="erro" class="alert alert-danger d-none"></div>
        <div id="sucesso" class="alert alert-success d-none"></div>
        <button class="btn w-100 mb-2" onclick="cadastrar()"
            style="background-color: cadetblue; color: white; font-weight: 600;">Cadastrar</button>
        <div class="text-center mt-2">
            <a href="login.html" style="color: cadetblue; text-decoration: none;">Já tenho login</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        async function cadastrar() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('erro');
            const sucesso = document.getElementById('sucesso');

            try {
                const resposta = await fetch(`${API}/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    erro.textContent = dados.erro;
                    erro.classList.remove('d-none');
                    sucesso.classList.add('d-none');
                    return;
                }

                sucesso.textContent = 'Conta criada com sucesso!';
                sucesso.classList.remove('d-none');
                erro.classList.add('d-none');

                const resposta2 = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados2 = await resposta2.json();
                const payload = JSON.parse(atob(dados2.token.split('.')[1]));
                localStorage.setItem('token', dados2.token);
                localStorage.setItem('usuario', payload.nome);
                window.location.href = 'index.html';

            } catch (err) {
                erro.textContent = 'Erro ao conectar com o servidor';
                erro.classList.remove('d-none');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
