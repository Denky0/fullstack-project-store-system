<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
</head>

<body class="bg-dark d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 border-0"
        style="width: 380px; background-color: #111; border-radius: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.9), 0 0 18px rgba(95,158,160,0.25); transform: translateY(-6px);">
        <h2 class="text-center mb-4" style="color: cadetblue; font-weight: 600;">Acesso ao Sistema</h2>
        <div class="mb-3">
            <label class="form-label text-light">Informe seu E-mail</label>
            <input class="form-control bg-dark text-light border-secondary" type="email" id="email"
                placeholder="Digite seu email" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-light">Informe sua Senha</label>
            <input class="form-control bg-dark text-light border-secondary" type="password" id="senha"
                placeholder="Digite sua senha" required>
        </div>
        <div id="erro" class="alert alert-danger d-none"></div>
        <button class="btn w-100 mb-2" onclick="login()"
            style="background-color: cadetblue; color: white; font-weight: 600;">Entrar</button>
        <div class="text-center mt-2">
            <a href="cadastro.html" style="color: cadetblue; text-decoration: none;">Criar uma conta</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
